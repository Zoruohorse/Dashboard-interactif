"<strong>dcmag.fr :</strong> Article du 11 septembre 2026 annonçant l’abandon de l’implantation de BXIA sur les parkings du Parc des expositions, avec un réexamen et une possible relocalisation."
]
};
let activeCategory='all',activeStance='all',searchTerm='';
function normalizeText(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('header-title').innerText=projectData.meta.title;document.getElementById('header-subtitle').innerText=projectData.meta.subtitle;renderFilters();renderGrid();renderGriefs();renderLists();});
function switchTab(tabName,btn){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));btn.classList.add('active');document.getElementById(`tab-${tabName}`).classList.add('active');}
function renderFilters(){const cat=document.getElementById('cat-filters-container'),stance=document.getElementById('stance-filters-container');cat.innerHTML='';stance.innerHTML='';Object.entries(projectData.taxonomy.categories).forEach(([key,label])=>{const count=key==='all'?projectData.actors.length:projectData.actors.filter(a=>a.category===key).length;cat.innerHTML+=`<button type="button" class="filter-btn ${key===activeCategory?'active':''}" onclick="setCategoryFilter('${key}',this)"><span>${label}</span><span class="count">${count}</span></button>`;});Object.entries(projectData.taxonomy.stances).forEach(([key,label])=>{const count=key==='all'?projectData.actors.length:projectData.actors.filter(a=>a.stance===key).length;stance.innerHTML+=`<button type="button" class="filter-btn ${key===activeStance?'active':''}" onclick="setStanceFilter('${key}',this)"><span>${label}</span><span class="count">${count}</span></button>`;});}
function setCategoryFilter(category,el){document.querySelectorAll('#cat-filters-container .filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');activeCategory=category;renderGrid();}
function setStanceFilter(stance,el){document.querySelectorAll('#stance-filters-container .filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');activeStance=stance;renderGrid();}
function setSearch(value){searchTerm=normalizeText(value);renderGrid();}
function resetAllFilters(){activeCategory='all';activeStance='all';searchTerm='';document.getElementById('actor-search').value='';renderFilters();renderGrid();}
function renderGrid(){const grid=document.getElementById('actors-grid');grid.innerHTML='';const filtered=projectData.actors.filter(actor=>{const matchCategory=activeCategory==='all'||actor.category===activeCategory;const matchStance=activeStance==='all'||actor.stance===activeStance;const searchable=normalizeText([actor.name,actor.role,actor.position,actor.evidence,actor.certainty,projectData.taxonomy.categories[actor.category]||'',projectData.taxonomy.stances[actor.stance]||''].join(' '));return matchCategory&&matchStance&&(searchTerm===''||searchable.includes(searchTerm));});if(!filtered.length){grid.innerHTML='<div class="empty-state">Aucun acteur ne correspond à votre recherche et aux filtres sélectionnés.</div>';return;}filtered.forEach(actor=>{const card=document.createElement('article');card.className=`actor-card ${actor.stance}`;card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`Afficher les détails de ${actor.name}`);card.innerHTML=`<div><div class="actor-header"><div class="actor-name">${actor.name}</div><div class="actor-role">${actor.role}</div></div><div class="actor-body">${actor.position}</div></div><div class="actor-footer"><span class="badge ${actor.stance}">${projectData.taxonomy.stances[actor.stance]}</span><span class="certitude">Certitude : ${actor.certainty}</span></div>`;card.onclick=()=>openActorModal(actor);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openActorModal(actor);}};grid.appendChild(card);});}
function renderGriefs(){const container=document.getElementById('griefs-grid');container.innerHTML='';projectData.griefs.forEach(g=>container.innerHTML+=`<article class="grief-card"><h2>${g.title}</h2><p>${g.text}</p></article>`);}
function renderLists(){const vig=document.getElementById('vigilance-list'),src=document.getElementById('sources-list');vig.innerHTML='';src.innerHTML='';projectData.vigilance.forEach(item=>vig.innerHTML+=`<li>${item}</li>`);projectData.sources.forEach(item=>src.innerHTML+=`<li>${item}</li>`);}
function openActorModal(actor){document.getElementById('modal-name').innerText=actor.name;document.getElementById('modal-role').innerText=actor.role;document.getElementById('modal-position').innerText=actor.position;document.getElementById('modal-verbatim').innerText=actor.evidence||'Aucun verbatim direct extrait dans le corpus.';document.getElementById('modal-certainty').innerText=actor.certainty;const badge=document.getElementById('modal-stance-badge');badge.className=`badge ${actor.stance}`;badge.innerText=projectData.taxonomy.stances[actor.stance];toggleModal(true);}
function toggleModal(show){document.getElementById('actor-modal').classList.toggle('active',show);document.body.style.overflow=show?'hidden':'';}
function closeModal(event){if(event.target.id==='actor-modal')toggleModal(false);}
document.addEventListener('keydown',event=>{if(event.key==='Escape')toggleModal(false);});
</script>
</body>
