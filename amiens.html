<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartographie interactive — Ligne THT Amiens – Petit-Caux</title>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;

            --color-opposed: #ef4444;
            --color-opposed-light: #fee2e2;
            --color-favorable: #22c55e;
            --color-favorable-light: #dcfce7;
            --color-neutral: #f59e0b;
            --color-neutral-light: #fef3c7;

            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;

            --radius: 12px;
            --shadow:
                0 4px 6px -1px rgb(0 0 0 / 0.05),
                0 2px 4px -2px rgb(0 0 0 / 0.05);

            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem;
        }

        button,
        input {
            font: inherit;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        header h1 {
            margin-bottom: 0.5rem;
            color: #0f172a;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        header p {
            max-width: 1100px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* =====================================================
           ONGLETS
        ===================================================== */

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            border: none;
            border-radius: var(--radius);
            padding: 0.5rem 1rem;
            background: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           INTERFACE PRINCIPALE
           
           Les cartes sont dans la première colonne.
           La barre latérale est dans la seconde colonne.
        ===================================================== */

        .dashboard-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 310px;
            gap: 2rem;
            align-items: start;
        }

        /* =====================================================
           GRILLE DES CARTES
        ===================================================== */

        .actors-area {
            min-width: 0;
        }

        .results-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            min-height: 35px;
            margin-bottom: 1rem;
        }

        .results-count {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .actors-grid {
            display: grid;

            /* Deux cartes exactement par ligne sur grand écran */
            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 1.5rem;
            align-items: stretch;
            min-width: 0;
        }

        .actor-card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            min-height: 240px;
            overflow: hidden;

            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;

            background-color: var(--bg-card);
            box-shadow: var(--shadow);

            cursor: pointer;
            transition: var(--transition);
        }

        .actor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .actor-card:focus-visible {
            outline: 3px solid rgba(59, 130, 246, 0.35);
            outline-offset: 3px;
        }

        .actor-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
        }

        .actor-card.opposed::before {
            background-color: var(--color-opposed);
        }

        .actor-card.favorable::before {
            background-color: var(--color-favorable);
        }

        .actor-card.neutral::before {
            background-color: var(--color-neutral);
        }

        .actor-header {
            margin-bottom: 1rem;
        }

        .actor-name {
            margin-bottom: 0.25rem;
            overflow-wrap: anywhere;
            color: #0f172a;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .actor-role {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .actor-body {
            display: -webkit-box;
            margin-bottom: 1rem;
            overflow: hidden;
            color: var(--text-main);
            font-size: 0.95rem;

            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .actor-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;

            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;

            font-size: 0.8rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 20px;
            padding: 0.25rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            text-transform: uppercase;
        }

        .badge.opposed {
            background-color: var(--color-opposed-light);
            color: var(--color-opposed);
        }

        .badge.favorable {
            background-color: var(--color-favorable-light);
            color: var(--color-favorable);
        }

        .badge.neutral {
            background-color: var(--color-neutral-light);
            color: var(--color-neutral);
        }

        .certitude {
            color: var(--text-muted);
            font-style: italic;
            text-align: right;
        }

        .empty-state {
            grid-column: 1 / -1;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 3rem 1.5rem;
            background-color: var(--bg-card);
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
        }

        /* =====================================================
           BARRE LATÉRALE À DROITE
        ===================================================== */

        .filters-sidebar {
            position: sticky;
            top: 2rem;
            min-width: 0;

            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;

            background-color: var(--bg-card);
            box-shadow: var(--shadow);
        }

        .filter-section {
            margin-bottom: 1.5rem;
        }

        .filter-section:last-child {
            margin-bottom: 0;
        }

        .filter-section h3 {
            margin-bottom: 0.75rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;

            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;

            background-color: var(--bg-primary);
            color: var(--text-main);

            font-size: 0.9rem;
            font-weight: 500;
            text-align: left;

            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--primary);
            background-color: var(--primary);
            color: white;
        }

        .filter-btn:focus-visible {
            outline: 3px solid rgba(59, 130, 246, 0.25);
            outline-offset: 2px;
        }

        .filter-btn .count {
            flex: 0 0 auto;
            min-width: 24px;
            border-radius: 10px;
            padding: 0.1rem 0.4rem;
            background-color: rgba(0, 0, 0, 0.06);
            font-size: 0.75rem;
            text-align: center;
        }

        .filter-btn.active .count,
        .filter-btn:hover .count {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* =====================================================
           RECHERCHE RENFORCÉE
        ===================================================== */

        .search-section {
            margin-bottom: 1.75rem;
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 10px;
            padding: 1rem;

            background:
                linear-gradient(
                    135deg,
                    rgba(59, 130, 246, 0.14),
                    rgba(59, 130, 246, 0.04)
                );
        }

        .search-label {
            display: block;
            margin-bottom: 0.65rem;
            color: #1e40af;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 0.85rem;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 1.1rem;
            line-height: 1;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            min-height: 48px;

            border: 2px solid var(--primary);
            border-radius: 8px;
            outline: none;
            padding: 0.75rem 2.5rem 0.75rem 2.6rem;

            background-color: #ffffff;
            color: var(--text-main);

            font-size: 0.9rem;
            font-weight: 500;

            transition: var(--transition);
        }

        .search-input::placeholder {
            color: #64748b;
            opacity: 1;
        }

        .search-input:hover {
            border-color: #2563eb;
        }

        .search-input:focus {
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18);
        }

        /* Apparence du bouton natif d'effacement */
        .search-input::-webkit-search-cancel-button {
            cursor: pointer;
        }

        .clear-search {
            position: absolute;
            top: 50%;
            right: 0.65rem;
            display: none;
            transform: translateY(-50%);

            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;

            background-color: var(--border-color);
            color: var(--text-muted);

            font-size: 1rem;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
        }

        .clear-search.visible {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .clear-search:hover {
            background-color: #cbd5e1;
            color: var(--text-main);
        }

        .search-help {
            margin-top: 0.55rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .reset-filters-btn {
            width: 100%;
            margin-top: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.65rem 0.8rem;

            background-color: white;
            color: var(--text-muted);

            font-size: 0.85rem;
            font-weight: 600;

            cursor: pointer;
            transition: var(--transition);
        }

        .reset-filters-btn:hover {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary-dark);
        }

        /* =====================================================
           MODALE
        ===================================================== */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: none;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;
            padding: 1rem;

            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 100%;
            max-width: 600px;
            max-height: calc(100vh - 2rem);
            overflow-y: auto;

            border-radius: var(--radius);
            padding: 2rem;

            background-color: var(--bg-card);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);

            animation: modalAnim 0.2s ease-out;
        }

        @keyframes modalAnim {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;

            border: none;
            background: none;
            color: var(--text-muted);

            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-modal:hover {
            color: var(--text-main);
        }

        .modal-field {
            margin-bottom: 1.25rem;
        }

        .modal-field label {
            display: block;
            margin-bottom: 0.25rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .modal-field p {
            color: var(--text-main);
            font-size: 1rem;
        }

        .modal-title {
            padding-right: 2rem;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .modal-verbatim {
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            padding: 1rem;
            background-color: var(--bg-primary);
            font-style: italic;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .modal-footer .modal-field {
            margin: 0;
        }

        .modal-footer .modal-field:last-child {
            text-align: right;
        }

        /* =====================================================
           ONGLET GRIEFS
        ===================================================== */

        .griefs-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 2rem;
        }

        .grief-card {
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2rem;
            background-color: var(--bg-card);
            box-shadow: var(--shadow);
        }

        .grief-card h2 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: #0f172a;
            font-size: 1.3rem;
            font-weight: 700;
        }

        /* =====================================================
           LISTES ET SOURCES
        ===================================================== */

        .list-card {
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2rem;
            background-color: var(--bg-card);
            box-shadow: var(--shadow);
        }

        .list-card h2 {
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }

        .list-card ul {
            padding-left: 1.5rem;
        }

        .list-card li {
            margin-bottom: 0.75rem;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1150px) {
            .dashboard-layout {
                grid-template-columns: minmax(0, 1fr) 280px;
                gap: 1.25rem;
            }

            /*
             * On conserve deux cartes tant que l'espace le permet.
             * Leur largeur minimale est réduite automatiquement.
             */
            .actors-grid {
                gap: 1rem;
            }

            .actor-card {
                padding: 1.25rem;
            }
        }

        @media (max-width: 900px) {
            body {
                padding: 1.25rem;
            }

            .dashboard-layout {
                grid-template-columns: 1fr;
            }

            /*
             * La sidebar vient au-dessus des cartes sur tablette
             * et mobile, même si elle est placée après dans le HTML.
             */
            .filters-sidebar {
                grid-row: 1;
                position: static;
            }

            .actors-area {
                grid-row: 2;
            }

            .actors-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .filter-options {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            body {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            header p {
                font-size: 1rem;
            }

            .tabs {
                gap: 0.5rem;
            }

            .tab-btn {
                flex: 1 1 100%;
            }

            .actors-grid,
            .griefs-container {
                grid-template-columns: 1fr;
            }

            .filter-options {
                grid-template-columns: 1fr;
            }

            .actor-footer,
            .modal-footer {
                align-items: flex-start;
                flex-direction: column;
            }

            .certitude,
            .modal-footer .modal-field:last-child {
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1 id="header-title">Chargement...</h1>
        <p id="header-subtitle"></p>
    </header>

    <nav class="tabs" aria-label="Navigation principale">
        <button
            class="tab-btn active"
            type="button"
            onclick="switchTab('carto', this)"
        >
            Cartographie des acteurs
        </button>

        <button
            class="tab-btn"
            type="button"
            onclick="switchTab('griefs', this)"
        >
            Synthèse des oppositions
        </button>

        <button
            class="tab-btn"
            type="button"
            onclick="switchTab('vigilance', this)"
        >
            Points de vigilance &amp; sources
        </button>
    </nav>

    <!-- =====================================================
         ONGLET CARTOGRAPHIE
    ====================================================== -->

    <div id="tab-carto" class="tab-content active">
        <div class="dashboard-layout">

            <!-- Les cartes sont volontairement placées en premier -->
            <main class="actors-area">
                <div class="results-summary">
                    <p
                        id="results-count"
                        class="results-count"
                        aria-live="polite"
                    ></p>
                </div>

                <div
                    class="actors-grid"
                    id="actors-grid"
                ></div>
            </main>

            <!-- Barre latérale placée à droite -->
            <aside
                class="filters-sidebar"
                aria-label="Recherche et filtres de la cartographie"
            >
                <div class="search-section">
                    <label
                        class="search-label"
                        for="actor-search"
                    >
                        Rechercher un acteur
                    </label>

                    <div class="search-wrapper">
                        <span
                            class="search-icon"
                            aria-hidden="true"
                        >
                            🔍
                        </span>

                        <input
                            id="actor-search"
                            class="search-input"
                            type="search"
                            placeholder="Nom, fonction, argument..."
                            autocomplete="off"
                            aria-describedby="search-help"
                            oninput="setSearch(this.value)"
                        >

                        <button
                            id="clear-search"
                            class="clear-search"
                            type="button"
                            aria-label="Effacer la recherche"
                            title="Effacer la recherche"
                            onclick="clearSearch()"
                        >
                            ×
                        </button>
                    </div>

                    <p
                        id="search-help"
                        class="search-help"
                    >
                        Recherche dans le nom, la fonction, la position et les preuves documentaires.
                    </p>
                </div>

                <div class="filter-section">
                    <h3>Collèges d'acteurs</h3>

                    <div
                        class="filter-options"
                        id="cat-filters-container"
                    ></div>
                </div>

                <div class="filter-section">
                    <h3>Positionnement</h3>

                    <div
                        class="filter-options"
                        id="stance-filters-container"
                    ></div>
                </div>

                <button
                    class="reset-filters-btn"
                    type="button"
                    onclick="resetAllFilters()"
                >
                    Réinitialiser la recherche et les filtres
                </button>
            </aside>

        </div>
    </div>

    <!-- =====================================================
         ONGLET GRIEFS
    ====================================================== -->

    <div id="tab-griefs" class="tab-content">
        <div
            class="griefs-container"
            id="griefs-grid"
        ></div>
    </div>

    <!-- =====================================================
         ONGLET VIGILANCE ET SOURCES
    ====================================================== -->

    <div id="tab-vigilance" class="tab-content">
        <div class="list-card">
            <h2>🔍 Points de vigilance majeurs</h2>
            <ul id="vigilance-list"></ul>
        </div>

        <div class="list-card">
            <h2>📰 Médias et sources d'investigation répertoriés</h2>
            <ul id="sources-list"></ul>
        </div>
    </div>

    <!-- =====================================================
         MODALE
    ====================================================== -->

    <div
        class="modal"
        id="actor-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-name"
        onclick="closeModal(event)"
    >
        <div
            class="modal-content"
            onclick="event.stopPropagation()"
        >
            <button
                class="close-modal"
                type="button"
                aria-label="Fermer la fenêtre"
                onclick="toggleModal(false)"
            >
                ×
            </button>

            <div class="modal-field">
                <label>Nom / Entité</label>
                <h2
                    id="modal-name"
                    class="modal-title"
                ></h2>
            </div>

            <div class="modal-field">
                <label>Fonction / Rattachement</label>
                <p id="modal-role"></p>
            </div>

            <div class="modal-field">
                <label>Positionnement ou argument principal</label>
                <p id="modal-position"></p>
            </div>

            <div class="modal-field">
                <label>Verbatim / Preuve documentaire</label>

                <p
                    id="modal-verbatim"
                    class="modal-verbatim"
                ></p>
            </div>

            <div class="modal-footer">
                <div class="modal-field">
                    <label>Orientation</label>

                    <span
                        id="modal-stance-badge"
                        class="badge"
                    ></span>
                </div>

                <div class="modal-field">
                    <label>Niveau de certitude</label>

                    <p
                        id="modal-certainty"
                        class="certitude"
                    ></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        /*
         * Conservez ici votre objet projectData complet.
         * Il n'est pas nécessaire de modifier vos tableaux actors,
         * griefs, vigilance et sources.
         */

        const projectData = {

        /* =====================================================

        ===================================================== */

        function normalizeText(value) {
            return String(value || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }

        /* =====================================================
           INITIALISATION
        ===================================================== */

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("header-title").innerText =
                projectData.meta.title;

            document.getElementById("header-subtitle").innerText =
                projectData.meta.subtitle;

            renderFilters();
            renderGrid();
            renderGriefs();
            renderLists();
        });

        /* =====================================================
           ONGLETS
        ===================================================== */

        function switchTab(tabName, btn) {
            document
                .querySelectorAll(".tab-btn")
                .forEach(button => button.classList.remove("active"));

            document
                .querySelectorAll(".tab-content")
                .forEach(content => content.classList.remove("active"));

            btn.classList.add("active");

            document
                .getElementById(`tab-${tabName}`)
                .classList.add("active");
        }

        /* =====================================================
           FILTRES LATÉRAUX
        ===================================================== */

        function renderFilters() {
            const catContainer =
                document.getElementById("cat-filters-container");

            const stanceContainer =
                document.getElementById("stance-filters-container");

            catContainer.innerHTML = "";
            stanceContainer.innerHTML = "";

            Object.entries(projectData.taxonomy.categories)
                .forEach(([key, label]) => {
                    const count =
                        key === "all"
                            ? projectData.actors.length
                            : projectData.actors.filter(
                                actor => actor.category === key
                            ).length;

                    const button = document.createElement("button");

                    button.type = "button";
                    button.className =
                        `filter-btn ${key === activeCategory ? "active" : ""}`;

                    button.innerHTML = `
                        <span>${label}</span>
                        <span class="count">${count}</span>
                    `;

                    button.addEventListener("click", () => {
                        setCategoryFilter(key);
                    });

                    catContainer.appendChild(button);
                });

            Object.entries(projectData.taxonomy.stances)
                .forEach(([key, label]) => {
                    const count =
                        key === "all"
                            ? projectData.actors.length
                            : projectData.actors.filter(
                                actor => actor.stance === key
                            ).length;

                    const button = document.createElement("button");

                    button.type = "button";
                    button.className =
                        `filter-btn ${key === activeStance ? "active" : ""}`;

                    button.innerHTML = `
                        <span>${label}</span>
                        <span class="count">${count}</span>
                    `;

                    button.addEventListener("click", () => {
                        setStanceFilter(key);
                    });

                    stanceContainer.appendChild(button);
                });
        }

        function setCategoryFilter(category) {
            activeCategory = category;
            renderFilters();
            renderGrid();
        }

        function setStanceFilter(stance) {
            activeStance = stance;
            renderFilters();
            renderGrid();
        }

        /* =====================================================
           RECHERCHE
        ===================================================== */

        function setSearch(value) {
            searchTerm = normalizeText(value);

            const clearButton =
                document.getElementById("clear-search");

            clearButton.classList.toggle(
                "visible",
                searchTerm !== ""
            );

            renderGrid();
        }

        function clearSearch() {
            const searchInput =
                document.getElementById("actor-search");

            searchInput.value = "";
            searchTerm = "";

            document
                .getElementById("clear-search")
                .classList.remove("visible");

            renderGrid();
            searchInput.focus();
        }

        function resetAllFilters() {
            activeCategory = "all";
            activeStance = "all";
            searchTerm = "";

            const searchInput =
                document.getElementById("actor-search");

            searchInput.value = "";

            document
                .getElementById("clear-search")
                .classList.remove("visible");

            renderFilters();
            renderGrid();
        }
