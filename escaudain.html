<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartographie interactive — Campus Data Centers Escaudain</title>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --color-opposed: #ef4444;
            --color-opposed-light: #fee2e2;
            --color-favorable: #22c55e;
            --color-favorable-light: #dcfce7;
            --color-neutral: #f59e0b;
            --color-neutral-light: #fef3c7;
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem;
        }

        button,
        input {
            font: inherit;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        header h1 {
            margin-bottom: 0.5rem;
            color: #0f172a;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        header p {
            max-width: 1100px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            border: none;
            border-radius: var(--radius);
            padding: 0.5rem 1rem;
            background: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 310px minmax(0, 1fr);
            gap: 2rem;
            align-items: start;
        }

        .actors-area {
            min-width: 0;
        }

        .results-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            min-height: 35px;
            margin-bottom: 1rem;
        }

        .results-count {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .actors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            align-items: stretch;
            min-width: 0;
        }

        .actor-card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            min-height: 220px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            background-color: var(--bg-card);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
        }

        .actor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .actor-card:focus-visible {
            outline: 3px solid rgba(59, 130, 246, 0.35);
            outline-offset: 3px;
        }

        .actor-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
        }

        .actor-card.opposed::before { background-color: var(--color-opposed); }
        .actor-card.favorable::before { background-color: var(--color-favorable); }
        .actor-card.neutral::before { background-color: var(--color-neutral); }

        .actor-header { margin-bottom: 0.75rem; }

        .actor-name {
            margin-bottom: 0.25rem;
            overflow-wrap: anywhere;
            color: #0f172a;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .actor-role {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .actor-body {
            display: -webkit-box;
            margin-bottom: 1rem;
            overflow: hidden;
            color: var(--text-main);
            font-size: 0.85rem;
            line-height: 1.4;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .actor-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
            font-size: 0.75rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 20px;
            padding: 0.2rem 0.5rem;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            text-transform: uppercase;
        }

        .badge.opposed { background-color: var(--color-opposed-light); color: var(--color-opposed); }
        .badge.favorable { background-color: var(--color-favorable-light); color: var(--color-favorable); }
        .badge.neutral { background-color: var(--color-neutral-light); color: var(--color-neutral); }

        .certitude {
            color: var(--text-muted);
            font-style: italic;
            text-align: right;
        }

        .empty-state {
            grid-column: 1 / -1;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 3rem 1.5rem;
            background-color: var(--bg-card);
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
        }

        .filters-sidebar {
            position: sticky;
            top: 2rem;
            min-width: 0;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            background-color: var(--bg-card);
            box-shadow: var(--shadow);
        }

        .filter-section { margin-bottom: 1.5rem; }
        .filter-section:last-child { margin-bottom: 0; }

        .filter-section h3 {
            margin-bottom: 0.75rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--primary);
            background-color: var(--primary);
            color: white;
        }

        .filter-btn:focus-visible {
            outline: 3px solid rgba(59, 130, 246, 0.25);
            outline-offset: 2px;
        }

        .filter-btn .count {
            flex: 0 0 auto;
            min-width: 24px;
            border-radius: 10px;
            padding: 0.1rem 0.4rem;
            background-color: rgba(0, 0, 0, 0.06);
            font-size: 0.75rem;
            text-align: center;
        }

        .filter-btn.active .count,
        .filter-btn:hover .count { background-color: rgba(255, 255, 255, 0.2); }

        .search-section {
            margin-bottom: 1.75rem;
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 10px;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.14), rgba(59, 130, 246, 0.04));
        }

        .search-label {
            display: block;
            margin-bottom: 0.65rem;
            color: #1e40af;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .search-wrapper { position: relative; }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 0.85rem;
            transform: translateY(-50%);
            color: var(--primary);
            line-height: 1;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            min-height: 48px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            outline: none;
            padding: 0.75rem 2.5rem 0.75rem 2.6rem;
            background-color: #ffffff;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18);
        }

        .clear-search {
            position: absolute;
            top: 50%;
            right: 0.65rem;
            display: none;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background-color: var(--border-color);
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .clear-search.visible {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .clear-search:hover { background-color: #cbd5e1; color: var(--text-main); }

        .search-help {
            margin-top: 0.55rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .reset-filters-btn {
            width: 100%;
            margin-top: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.65rem 0.8rem;
            background-color: white;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .reset-filters-btn:hover {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary-dark);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        .modal.active { display: flex; }

        .modal-content {
            position: relative;
            width: 100%;
            max-width: 600px;
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            border-radius: var(--radius);
            padding: 2rem;
            background-color: var(--bg-card);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            animation: modalAnim 0.2s ease-out;
        }

        @keyframes modalAnim {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-field { margin-bottom: 1.25rem; }

        .modal-field label {
            display: block;
            margin-bottom: 0.25rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .modal-title {
            padding-right: 2rem;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .modal-verbatim {
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            padding: 1rem;
            background-color: var(--bg-primary);
            font-style: italic;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .modal-footer .modal-field { margin: 0; }
        .modal-footer .modal-field:last-child { text-align: right; }

        .griefs-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 2rem;
        }

        .grief-card,
        .list-card {
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2rem;
            background-color: var(--bg-card);
            box-shadow: var(--shadow);
        }

        .grief-card h2 { margin-bottom: 1rem; color: #0f172a; font-size: 1.3rem; }
        .list-card { margin-bottom: 2rem; }
        .list-card h2 { margin-bottom: 1rem; font-size: 1.4rem; }
        .list-card ul { padding-left: 1.5rem; }
        .list-card li { margin-bottom: 0.75rem; }

        @media (max-width: 1150px) {
            .dashboard-layout { grid-template-columns: 280px minmax(0, 1fr); gap: 1.25rem; }
        }

        @media (max-width: 900px) {
            body { padding: 1.25rem; }
            .dashboard-layout { grid-template-columns: 1fr; }
            .filters-sidebar { grid-row: 1; position: static; }
            .actors-area { grid-row: 2; }
            .filter-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 650px) {
            body { padding: 1rem; }
            header h1 { font-size: 1.75rem; }
            .tab-btn { flex: 1 1 100%; }
            .actors-grid { grid-template-columns: 1fr; }
            .griefs-container,
            .filter-options { grid-template-columns: 1fr; }
            .modal-footer { align-items: flex-start; flex-direction: column; }
            .certitude,
            .modal-footer .modal-field:last-child { text-align: left; }
        }
    </style>
</head>

<body>
    <header>
        <h1 id="header-title">Chargement...</h1>
        <p id="header-subtitle"></p>
    </header>

    <nav class="tabs" aria-label="Navigation principale">
        <button class="tab-btn active" type="button" data-tab="carto">Cartographie des acteurs</button>
        <button class="tab-btn" type="button" data-tab="griefs">Synthèse des oppositions</button>
        <button class="tab-btn" type="button" data-tab="vigilance">Points de vigilance &amp; sources</button>
    </nav>

    <div id="tab-carto" class="tab-content active">
        <div class="dashboard-layout">
            <aside class="filters-sidebar" aria-label="Recherche et filtres de la cartographie">
                <div class="search-section">
                    <label class="search-label" for="actor-search">Rechercher un acteur</label>

                    <div class="search-wrapper">
                        <span class="search-icon" aria-hidden="true">🔍</span>

                        <input
                            id="actor-search"
                            class="search-input"
                            type="search"
                            placeholder="Nom, fonction, argument..."
                            autocomplete="off"
                            aria-describedby="search-help"
                        >

                        <button
                            id="clear-search"
                            class="clear-search"
                            type="button"
                            aria-label="Effacer la recherche"
                            title="Effacer la recherche"
                        >×</button>
                    </div>

                    <p id="search-help" class="search-help">
                        Recherche dans le nom, la fonction, la position et les preuves documentaires.
                    </p>
                </div>

                <div class="filter-section">
                    <h3>Collèges d'acteurs</h3>
                    <div class="filter-options" id="cat-filters-container"></div>
                </div>

                <div class="filter-section">
                    <h3>Positionnement</h3>
                    <div class="filter-options" id="stance-filters-container"></div>
                </div>

                <button class="reset-filters-btn" id="reset-filters" type="button">
                    Réinitialiser la recherche et les filtres
                </button>
            </aside>

            <main class="actors-area">
                <div class="results-summary">
                    <p id="results-count" class="results-count" aria-live="polite"></p>
                </div>

                <div class="actors-grid" id="actors-grid"></div>
            </main>
        </div>
    </div>

    <div id="tab-griefs" class="tab-content">
        <div class="griefs-container" id="griefs-grid"></div>
    </div>

    <div id="tab-vigilance" class="tab-content">
        <div class="list-card">
            <h2>🔍 Points de vigilance majeurs</h2>
            <ul id="vigilance-list"></ul>
        </div>

        <div class="list-card">
            <h2>📰 Médias et sources d'investigation répertoriés</h2>
            <ul id="sources-list"></ul>
        </div>
    </div>

    <div class="modal" id="actor-modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
        <div class="modal-content">
            <button class="close-modal" id="close-modal" type="button" aria-label="Fermer la fenêtre">×</button>

            <div class="modal-field">
                <label>Nom / Entité</label>
                <h2 id="modal-name" class="modal-title"></h2>
            </div>

            <div class="modal-field">
                <label>Fonction / Rattachement</label>
                <p id="modal-role"></p>
            </div>

            <div class="modal-field">
                <label>Positionnement ou argument principal</label>
                <p id="modal-position"></p>
            </div>

            <div class="modal-field">
                <label>Verbatim / Preuve documentaire</label>
                <p id="modal-verbatim" class="modal-verbatim"></p>
            </div>

            <div class="modal-footer">
                <div class="modal-field">
                    <label>Orientation</label>
                    <span id="modal-stance-badge" class="badge"></span>
                </div>

                <div class="modal-field">
                    <label>Niveau de certitude</label>
                    <p id="modal-certainty" class="certitude"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const projectData = {
            meta: {
                title: "Cartographie interactive — Campus de data centers — Escaudain",
                subtitle: "Projet majeur de campus de data centers IA sur l'ancienne friche Usinor d'Escaudain, porté par un consortium privé (Data4, Brookfield) avec un investissement de 5 milliards d'euros, fortement soutenu par l'État et les élus locaux pour la réindustrialisation."
            },
            taxonomy: {
                categories: {
                    "all": "Tous les acteurs",
                    "opposants": "Opposants & Experts",
                    "elus-opp": "Élus Opposés/Critiques",
                    "elus-fav": "Élus Favorables/Prudents",
                    "orgs": "Orgs & Collectifs",
                    "porteurs": "Porteurs & Économie"
                },
                stances: {
                    "all": "Toutes les positions",
                    "opposed": "Opposé / Critique",
                    "favorable": "Favorable / Soutien",
                    "neutral": "Prudent / Ambigü"
                }
            },
            actors: [
                { name: "Aymeric Robin", category: "elus-fav", stance: "favorable", role: "Président de la CAPH et maire de Raismes", position: "Porte politiquement le projet et insiste sur la réindustrialisation, l’emploi et la formation.", evidence: "Défend politiquement et publiquement le projet comme levier de réindustrialisation.", certainty: "Haute" },
                { name: "Bruno Saligot", category: "elus-fav", stance: "favorable", role: "Maire d’Escaudain et vice-président de l’agglomération", position: "Défend le projet et précise la montée en puissance progressive des emplois.", evidence: "Soutien assumé et communication sur les volumes d'emplois locaux.", certainty: "Haute" },
                { name: "Émilie Gérard", category: "elus-fav", stance: "favorable", role: "Chargée d’affaires développement économique", position: "Met en avant les avantages techniques du site, notamment la proximité du poste de Mastaing et la capacité de raccordement.", evidence: "Argumentation technique officielle de l'agglomération.", certainty: "Haute" },
                { name: "Communauté d’agglomération de La Porte du Hainaut", category: "elus-fav", stance: "favorable", role: "Collectivité territoriale centrale", position: "Choisit le consortium retenu et structure le récit local de reconversion industrielle.", evidence: "Validation institutionnelle du consortium (Data4, Brookfield, BT Immo).", certainty: "Haute" },
                { name: "Brookfield", category: "porteurs", stance: "favorable", role: "Fonds d’investissement canadien", position: "Membre du consortium retenu pour le futur campus de data centers d’Escaudain.", evidence: "Engagement financier en tant que membre du consortium validé.", certainty: "Haute" },
                { name: "BT Immo", category: "porteurs", stance: "favorable", role: "Acteur immobilier / constructeur", position: "Membre du consortium retenu avec Brookfield et Data4.", evidence: "Engagement opérationnel sur le volet foncier et constructif.", certainty: "Haute" },
                { name: "Data4", category: "porteurs", stance: "favorable", role: "Opérateur de data centers", position: "Membre du consortium retenu pour développer le campus d’Escaudain.", evidence: "Déploiement et exploitation technique de l'infrastructure.", certainty: "Haute" },
                { name: "AWS / Amazon Web Services", category: "porteurs", stance: "neutral", role: "Acteur candidat", position: "Cité comme ayant répondu à l’appel à manifestation d’intérêt, mais non retenu face au consortium.", evidence: "A manifesté son intérêt mais n'est pas le porteur final.", certainty: "Haute" },
                { name: "RTE", category: "orgs", stance: "neutral", role: "Gestionnaire du réseau de transport d’électricité", position: "Acteur clé du raccordement du site, qui figure parmi les sites fast track capables d’accueillir plus de 700 MW.", evidence: "Intervention sur les capacités d'alimentation Fast Track.", certainty: "Haute" },
                { name: "Nathalie Lemaître", category: "orgs", stance: "neutral", role: "Directrice générale du pôle Clients Systèmes Innovation chez RTE", position: "Intervient dans le cadrage national des raccordements et la priorisation des projets.", evidence: "Supervision des processus de raccordement des sites intensifs.", certainty: "Haute" },
                { name: "Enedis", category: "orgs", stance: "neutral", role: "Acteur de la distribution d'électricité", position: "Cité dans des réunions plus larges autour des projets data centers dans le Nord.", evidence: "Participant aux concertations techniques régionales.", certainty: "Haute" },
                { name: "Anne Le Hénanff", category: "elus-fav", stance: "favorable", role: "Ministre déléguée chargée de l’IA et du Numérique", position: "Associe Escaudain à la politique nationale de sécurisation et d’accélération des data centers.", evidence: "Caution politique sectorielle au sommet de l'État.", certainty: "Haute" },
                { name: "Roland Lescure", category: "elus-fav", stance: "favorable", role: "Ministre de l’Économie", position: "Cité dans le cadrage national d’accompagnement des projets.", evidence: "Soutien politique au volet souveraineté et réindustrialisation.", certainty: "Haute" },
                { name: "DGE", category: "orgs", stance: "favorable", role: "Direction générale des entreprises", position: "Partie prenante du dispositif national d’accompagnement des data centers.", evidence: "Facilitateur administratif des projets industriels d'envergure.", certainty: "Haute" },
                { name: "Business France", category: "orgs", stance: "favorable", role: "Agence nationale d'attractivité", position: "Acteur de la task force de l’État accompagnant les porteurs de projets.", evidence: "Promotion de l'attractivité des sites français (Choose France).", certainty: "Haute" },
                { name: "François Bayrou", category: "elus-fav", stance: "favorable", role: "Ancien Premier ministre", position: "Cité dans le contexte de l’annonce des sites industriels dits « clés en main ».", evidence: "Porteur de la vision d'aménagement industriel anticipé.", certainty: "Haute" },
                { name: "Université", category: "orgs", stance: "neutral", role: "Acteur académique", position: "Évoqué pour structurer les futures filières de formation liées au projet.", evidence: "Partenaire éducatif potentiel pour le campus.", certainty: "Moyenne" },
                { name: "Lycées", category: "orgs", stance: "neutral", role: "Établissements d'enseignement", position: "Acteurs éducatifs mentionnés comme nécessaires pour préparer les compétences du territoire.", evidence: "Maillon de la chaîne de formation locale.", certainty: "Moyenne" },
                { name: "Éducation nationale", category: "orgs", stance: "neutral", role: "Institution étatique", position: "Partie prenante citée pour développer les formations adaptées aux métiers du futur campus.", evidence: "Engagement attendu sur l'adaptation des cursus.", certainty: "Moyenne" },
                { name: "Olivier Micheli", category: "porteurs", stance: "favorable", role: "Président et CEO de Data4", position: "Insiste sur la fiabilité de son entreprise face aux annonces concurrentes.", evidence: "Discours public assurant la crédibilité et la solidité du consortium.", certainty: "Haute" },
                { name: "Emmanuel Macron", category: "elus-fav", stance: "favorable", role: "Président de la République", position: "A soutenu le projet via l'initiative Choose France et a négocié d'autres mégaprojets régionaux.", evidence: "Validation par le sommet de l'État via le programme Choose France.", certainty: "Haute" },
                { name: "Région Hauts-de-France", category: "elus-fav", stance: "favorable", role: "Collectivité régionale", position: "Organisatrice du forum « l’IA et nous » lors duquel le projet a été officialisé.", evidence: "Accompagnement politique et événementiel officiel.", certainty: "Haute" },
                { name: "Gouvernement français", category: "elus-fav", stance: "favorable", role: "Exécutif national", position: "Facilitateur du projet via la mise en place d'une procédure d'autorisation accélérée (fast track).", evidence: "Simplification des normes via la procédure Fast Track.", certainty: "Haute" },
                { name: "Préfet du Nord", category: "elus-fav", stance: "favorable", role: "Représentant de l'État en région", position: "Représentant de l'État ayant publiquement salué le lancement du projet.", evidence: "Approbation institutionnelle et soutien administratif local.", certainty: "Haute" },
                { name: "Softbank", category: "porteurs", stance: "neutral", role: "Fonds d'investissement japonais", position: "Impliqué dans un mégaprojet concurrent de trois data centers dans les Hauts-de-France.", evidence: "Cité en tant que concurrent développant un projet parallèle dans la même région.", certainty: "Haute" },
                { name: "Masayoshi Son", category: "porteurs", stance: "neutral", role: "Patron fondateur de Softbank", position: "Engagé par l'État pour remplacer le projet avorté de Fluidstack dans un autre secteur.", evidence: "Figure industrielle d'un projet régional concurrent.", certainty: "Haute" },
                { name: "Fluidstack", category: "porteurs", stance: "neutral", role: "Société technologique britannique", position: "Ayant abandonné un précédent projet de data center, justifiant la prudence sur les annonces d'investissements.", evidence: "Exemple cité d'un abandon industriel récent.", certainty: "Haute" },
                { name: "Institut Montaigne", category: "orgs", stance: "favorable", role: "Think tank économique", position: "Dont l'étude sur le stockage des données françaises justifie l'enjeu de souveraineté numérique du projet.", evidence: "Auteur de l'étude justifiant le narratif de souveraineté.", certainty: "Haute" },
                { name: "Louis Blanchot", category: "porteurs", stance: "neutral", role: "PDG d'Etix", position: "Interroge la valeur ajoutée réelle des projets hyperscale pour les territoires, soulignant leur très faible ratio d'emplois.", evidence: "Chez Etix, pour un mégawatt déployé, nous employons entre 2 et 5 personnes, largement plus que pour un hyperscale", certainty: "Haute" },
                { name: "Nebius", category: "porteurs", stance: "favorable", role: "Opérateur cloud", position: "Investit massivement sur le site de Béthune, densifiant le réseau d'infrastructures dans la région Hauts-de-France.", evidence: "l’opérateur cloud néerlandais Nebius injecterait plus de 8 milliards d’euros", certainty: "Haute" },
                { name: "SoftBank (Masayoshi Son)", category: "porteurs", stance: "favorable", role: "Conglomérat japonais", position: "Annonce un projet colossal de data centers dans la région, créant une pression concurrentielle sur les ressources énergétiques.", evidence: "pourrait à terme débloquer un total de 75 milliards d’euros", certainty: "Haute" },
                { name: "Xavier Bertrand", category: "elus-fav", stance: "favorable", role: "Président de Région", position: "Capitalise politiquement sur les annonces de Choose France pour positionner sa région comme leader européen de l'IA.", evidence: "Les Hauts-de-France sont devenus la vallée européenne de l'intelligence artificielle.", certainty: "Haute" }
            ],
            griefs: [
                { title: "⚡ Consommation électrique", text: "Le projet suppose une très forte demande de puissance, avec 700 MW visés à terme, ce qui sollicite lourdement les infrastructures existantes et requiert l'activation du poste électrique de Mastaing." },
                { title: "💧 Consommation d’eau", text: "Problématique hydrique classique inhérente aux centres de données. Les promoteurs du projet défendent l’idée d’un fonctionnement vertueux en circuit fermé pour garantir une consommation maîtrisée." },
                { title: "💼 Crédibilité des emplois", text: "Le volume de 2 400 emplois annoncés est au cœur du discours local de réindustrialisation, mais constitue un point de vigilance analytique récurrent au vu des faibles effectifs requis pour l'exploitation de serveurs." },
                { title: "👥 Acceptabilité locale", text: "Enjeu soulevé dans le cadrage réglementaire national des implantations d'infrastructures lourdes, impliquant une vigilance continue sur l'absence de fracture démocratique locale." },
                { title: "👁️ Absence d'opposition", text: "Fait d'analyse territorial notable : dans le corpus d'Escaudain étudié, aucun collectif citoyen d'opposition locale structurée ou opposant nommément identifié n'émerge à ce stade." },
                { title: "📉 Remise en cause du ratio d'emplois", text: "Le récit politique de la réindustrialisation par l'emploi est contredit par les professionnels (comme Etix) qui rappellent que les sites hyperscale comme Escaudain sont comparables à des entrepôts logistiques hautement automatisés (1 emploi pour 10 000 m²), créant bien moins de valeur locale que des structures de proximité." },
                { title: "⚡ Menace de cannibalisation électrique", text: "L'accumulation d'investissements annoncés au sommet Choose France (SoftBank, Nebius, Brookfield) soulève le risque d'une monopolisation du réseau électrique régional, menaçant l'accès à l'énergie d'autres secteurs économiques locaux." }
            ],
            vigilance: [
                "<strong>Crédibilité du ruissellement et des emplois :</strong> L'annonce phare de 2 400 emplois liés au projet constitue un socle du discours politique local, mais héberge une forte prudence analytique (notamment relayée par Mediacités) face aux ratios d'emploi traditionnellement bas de l'exploitation de data centers.",
                "<strong>Absence de front social :</strong> Le projet se distingue par l'absence d'une contestation environnementale ou associative territoriale structurée, facilitant grandement sa progression et son acceptation administrative.",
                "<strong>Capacités de raccordement électrique :</strong> La viabilité du projet repose entièrement sur le succès de la procédure Fast Track de l'État et la capacité de RTE à sanctuariser 700 MW depuis le poste de Mastaing, au risque d'une concurrence avec d'autres filières industrielles régionales.",
                "<strong>Guerre des annonces :</strong> Le sommet Choose France a provoqué une surenchère de milliards d'euros (jusqu'à 75 milliards pour SoftBank). Ces annonces macro-économiques doivent être traitées avec prudence quant à leur concrétisation opérationnelle et aux délais de raccordement électrique effectifs.",
                "<strong>Bpifrance (Big Media) :</strong> Source institutionnelle détaillant les enjeux économiques, les nuances sur l'emploi, et le positionnement stratégique post-Choose France.",
                "<strong>L'Observateur :</strong> Relais de la communication régionale sur l'émergence de la 'vallée de l'IA' dans les Hauts-de-France."
            ],
            sources: [
                "<strong>DCmag :</strong> Média spécialisé ayant relayé le choix du consortium Brookfield / BT Immo / Data4.",
                "<strong>La Voix du Nord :</strong> Source régionale centrale sur le projet d’Escaudain, les délibérations de l'agglomération et le suivi des friches.",
                "<strong>France 3 Régions :</strong> Média ayant détaillé le projet, ses emplois annoncés et les éléments techniques liés au raccordement électrique.",
                "<strong>20 Minutes :</strong> Source nationale relayant l’officialisation du projet près de Valenciennes lors du forum régional.",
                "<strong>Economie Matin :</strong> Source revenant sur la dimension stratégique et souveraine du projet pour le stockage des données.",
                "<strong>Les Smart Grids :</strong> Source centrée sur la dimension énergétique et technique du campus et du poste de Mastaing.",
                "<strong>Next :</strong> Source évoquant Escaudain dans le cadre national des sites de puissance prioritaires fast track.",
                "<strong>Mediacités :</strong> Média local adoptant un angle prudent et critique sur la réalité des promesses industrielles et d'emplois du secteur.",
                "<strong>Business Immo :</strong> Source B2B ayant relayé les investissements fonciers et immobiliers de Data4.",
                "<strong>Le Journal des Entreprises :</strong> Média économique détaillant l'ancrage du pôle européen d'IA dans le Nord.",
                "<strong>info.fr :</strong> Portail d'actualités récapitulant les caractéristiques écologiques et techniques du projet.",
                "<strong>Data Center Dynamics :</strong> Média sectoriel international cité pour l'historique industriel de l'ancienne friche Usinor.",
                "<strong>Baxtel :</strong> Base de données référençant Escaudain parmi les sites industriels clés en main prioritaires de l'État.",
                "<strong>La Gazette France :</strong> Source citant les déclarations des porteurs de projet et des élus de La Porte du Hainaut.",
                "<strong>L'Observateur :</strong> Média local relayant les propos de la mairie d'Escaudain sur les retombées fiscales."
            ]
        };

        let activeCategory = "all";
        let activeStance = "all";
        let searchTerm = "";
        let lastFocusedElement = null;

        function normalizeText(value) {
            return String(value || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }

        function getFilteredActors() {
            return projectData.actors.filter(actor => {
                const matchCategory = activeCategory === "all" || actor.category === activeCategory;
                const matchStance = activeStance === "all" || actor.stance === activeStance;
                const searchableText = normalizeText([
                    actor.name,
                    actor.role,
                    actor.position,
                    actor.evidence,
                    actor.certainty
                ].join(" "));
                const matchSearch = searchTerm === "" || searchableText.includes(searchTerm);

                return matchCategory && matchStance && matchSearch;
            });
        }

        function renderFilters() {
            const catContainer = document.getElementById("cat-filters-container");
            const stanceContainer = document.getElementById("stance-filters-container");

            catContainer.innerHTML = "";
            stanceContainer.innerHTML = "";

            Object.entries(projectData.taxonomy.categories).forEach(([key, label]) => {
                const count = key === "all"
                    ? projectData.actors.length
                    : projectData.actors.filter(actor => actor.category === key).length;

                const button = document.createElement("button");
                button.type = "button";
                button.className = `filter-btn ${key === activeCategory ? "active" : ""}`;
                button.setAttribute("aria-pressed", String(key === activeCategory));
                button.innerHTML = `
                    <span>${label}</span>
                    <span class="count">${count}</span>
                `;
                button.addEventListener("click", () => {
                    activeCategory = key;
                    renderFilters();
                    renderGrid();
                });

                catContainer.appendChild(button);
            });

            Object.entries(projectData.taxonomy.stances).forEach(([key, label]) => {
                const count = key === "all"
                    ? projectData.actors.length
                    : projectData.actors.filter(actor => actor.stance === key).length;

                const button = document.createElement("button");
                button.type = "button";
                button.className = `filter-btn ${key === activeStance ? "active" : ""}`;
                button.setAttribute("aria-pressed", String(key === activeStance));
                button.innerHTML = `
                    <span>${label}</span>
                    <span class="count">${count}</span>
                `;
                button.addEventListener("click", () => {
                    activeStance = key;
                    renderFilters();
                    renderGrid();
                });

                stanceContainer.appendChild(button);
            });
        }

        function renderGrid() {
            const grid = document.getElementById("actors-grid");
            const resultsCount = document.getElementById("results-count");
            const filteredActors = getFilteredActors();

            resultsCount.textContent = `${filteredActors.length} acteur${filteredActors.length > 1 ? "s" : ""} affiché${filteredActors.length > 1 ? "s" : ""} sur ${projectData.actors.length}`;
            grid.innerHTML = "";

            if (filteredActors.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        Aucun acteur ne correspond à votre recherche et aux filtres sélectionnés.
                    </div>
                `;
                return;
            }

            filteredActors.forEach(actor => {
                const card = document.createElement("article");
                card.className = `actor-card ${actor.stance}`;
                card.tabIndex = 0;
                card.setAttribute("role", "button");
                card.setAttribute("aria-label", `Ouvrir la fiche de ${actor.name}`);

                card.innerHTML = `
                    <div>
                        <div class="actor-header">
                            <div class="actor-name">${actor.name}</div>
                            <div class="actor-role">${actor.role}</div>
                        </div>

                        <div class="actor-body">${actor.position}</div>
                    </div>

                    <div class="actor-footer">
                        <span class="badge ${actor.stance}">
                            ${projectData.taxonomy.stances[actor.stance]}
                        </span>

                        <span class="certitude">
                            Certitude : ${actor.certainty}
                        </span>
                    </div>
                `;

                card.addEventListener("click", () => openActorModal(actor));
                card.addEventListener("keydown", event => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        openActorModal(actor);
                    }
                });

                grid.appendChild(card);
            });
        }

        function renderGriefs() {
            const container = document.getElementById("griefs-grid");
            container.innerHTML = "";

            if (projectData.griefs.length === 0) {
                container.innerHTML = `<div class="empty-state">Aucun grief formellement identifié dans cette extraction.</div>`;
                return;
            }

            projectData.griefs.forEach(grief => {
                const card = document.createElement("article");
                card.className = "grief-card";
                card.innerHTML = `
                    <h2>${grief.title}</h2>
                    <p>${grief.text}</p>
                `;
                container.appendChild(card);
            });
        }

        function renderLists() {
            const vigilanceList = document.getElementById("vigilance-list");
            const sourcesList = document.getElementById("sources-list");

            vigilanceList.innerHTML = "";
            sourcesList.innerHTML = "";

            if (projectData.vigilance.length === 0) {
                vigilanceList.innerHTML = `<li style="color: var(--text-muted); list-style: none;">Aucun point de vigilance identifié.</li>`;
            } else {
                projectData.vigilance.forEach(item => {
                    const listItem = document.createElement("li");
                    listItem.innerHTML = item;
                    vigilanceList.appendChild(listItem);
                });
            }

            if (projectData.sources.length === 0) {
                sourcesList.innerHTML = `<li style="color: var(--text-muted); list-style: none;">Aucune source identifiée.</li>`;
            } else {
                projectData.sources.forEach(item => {
                    const listItem = document.createElement("li");
                    listItem.innerHTML = item;
                    sourcesList.appendChild(listItem);
                });
            }
        }

        function switchTab(tabName, button) {
            document.querySelectorAll(".tab-btn").forEach(tabButton => {
                tabButton.classList.remove("active");
            });

            document.querySelectorAll(".tab-content").forEach(content => {
                content.classList.remove("active");
            });

            button.classList.add("active");
            document.getElementById(`tab-${tabName}`).classList.add("active");
        }

        function openActorModal(actor) {
            lastFocusedElement = document.activeElement;

            document.getElementById("modal-name").textContent = actor.name;
            document.getElementById("modal-role").textContent = actor.role;
            document.getElementById("modal-position").textContent = actor.position;
            document.getElementById("modal-verbatim").textContent = actor.evidence || "Aucun verbatim direct extrait dans le corpus.";
            document.getElementById("modal-certainty").textContent = actor.certainty;

            const badge = document.getElementById("modal-stance-badge");
            badge.className = `badge ${actor.stance}`;
            badge.textContent = projectData.taxonomy.stances[actor.stance];

            toggleModal(true);
        }

        function toggleModal(show) {
            const modal = document.getElementById("actor-modal");
            modal.classList.toggle("active", show);
            document.body.style.overflow = show ? "hidden" : "";

            if (show) {
                document.getElementById("close-modal").focus();
            } else if (lastFocusedElement) {
                lastFocusedElement.focus();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("header-title").textContent = projectData.meta.title;
            document.getElementById("header-subtitle").textContent = projectData.meta.subtitle;

            renderFilters();
            renderGrid();
            renderGriefs();
            renderLists();

            document.querySelectorAll(".tab-btn").forEach(button => {
                button.addEventListener("click", () => switchTab(button.dataset.tab, button));
            });

            const searchInput = document.getElementById("actor-search");
            const clearButton = document.getElementById("clear-search");

            searchInput.addEventListener("input", () => {
                searchTerm = normalizeText(searchInput.value);
                clearButton.classList.toggle("visible", searchTerm !== "");
                renderGrid();
            });

            clearButton.addEventListener("click", () => {
                searchInput.value = "";
                searchTerm = "";
                clearButton.classList.remove("visible");
                renderGrid();
                searchInput.focus();
            });

            document.getElementById("reset-filters").addEventListener("click", () => {
                activeCategory = "all";
                activeStance = "all";
                searchTerm = "";
                searchInput.value = "";
                clearButton.classList.remove("visible");
                renderFilters();
                renderGrid();
            });

            document.getElementById("close-modal").addEventListener("click", () => toggleModal(false));

            document.getElementById("actor-modal").addEventListener("click", event => {
                if (event.target.id === "actor-modal") {
                    toggleModal(false);
                }
            });

            document.addEventListener("keydown", event => {
                if (event.key === "Escape" && document.getElementById("actor-modal").classList.contains("active")) {
                    toggleModal(false);
                }
            });
        });
    </script>
</body>
